name: CI and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs on the self-hosted server runner (the account stays on the Free plan).
# pull_request is intentionally not a trigger: fork PRs must never execute on the server.
permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate and build
    runs-on: [self-hosted, linux, x64, robotics-directory]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build production site
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run end-to-end and accessibility tests
        run: pnpm test:e2e

      - name: Publish tested build to gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
